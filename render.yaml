databases:
  - name: editdocsnow-db
    plan: free
    databaseName: editdocsnow
    user: editdocsnow

services:
  - type: web
    name: editdocsnow-be
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs_editor/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: editdocsnow-db
          property: connectionString
    # Persistent disks require a paid instance type (not available on the
    # free plan). Uncomment once you upgrade the plan above, otherwise
    # uploaded/generated PDFs are lost on every deploy and restart.
    # disk:
    #   name: editdocsnow-media
    #   mountPath: /app/media
    #   sizeGB: 1
